name: Build and Test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# A newer push to the same PR or branch supersedes the run in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  # Keep in step with release.yml so CI builds with the toolchain that ships.
  XCODE_APP: /Applications/Xcode_26.6.app
jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Select Xcode
        run: |
          if [ ! -d "$XCODE_APP" ]; then
            echo "::error::$XCODE_APP is not on this runner image. Installed:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          swift --version
          echo "XCODE_BUILD=$(xcodebuild -version | awk '/Build version/ { print $3 }')" >> "$GITHUB_ENV"
      - name: Cache SwiftPM build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ runner.arch }}-xcode-${{ env.XCODE_BUILD }}-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ runner.arch }}-xcode-${{ env.XCODE_BUILD }}-
      - name: Build app, helper and CLI
        run: swift build -c debug
      - name: Run regression tests
        run: make test
      - name: Verify packaged application
        run: |
          make package
          codesign --verify --deep --strict dist/Nest.app
          test -x dist/Nest.app/Contents/MacOS/NestPFHelper
          dist/nestctl help
