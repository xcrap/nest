version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current (pin and version comment).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Let a new action release age a week before proposing it.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
